<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-700.woff2)}
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-latin-700.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;display:flex;flex-direction:column;background:#000}
.half{flex:1;position:relative;background-size:cover;display:flex;align-items:flex-end;justify-content:center;padding-bottom:70px}
.t{font-family:P;font-weight:700;color:#fff;font-size:56px;line-height:1.45;text-align:center;max-width:900px;text-wrap:balance;
   text-shadow:0 2px 3px rgba(0,0,0,.95),0 3px 18px rgba(0,0,0,.7)}
.t{position:relative;z-index:0}.t::before{content:'';position:absolute;inset:-6px -30px;background:rgba(0,0,0,.45);filter:blur(36px);border-radius:60px;z-index:-1}</style></head><body><section class="slide">
<div class="half" style="background-image:url(photos/p1.jpg);background-position:center 35%"><p class="t">مافي بنت بتشتغل اكتر من البنت اللي استوعبت انو ماحدا راح يجي ينقذها</p></div>
<div class="half" style="background-image:url(photos/p2.jpg);background-position:center 40%"><p class="t">وإنها هي الوحيدة المسؤولة عن بناء الحياة اللي بتحلم فيها</p></div>
</section></body></html>
