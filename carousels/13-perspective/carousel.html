<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(ibm-plex-sans-arabic-500.woff2)}@font-face{font-family:P;font-weight:500;src:url(ibm-plex-sans-arabic-latin-500.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;display:flex;flex-direction:column;background:#000}
.h{flex:1;position:relative;background-size:cover;display:flex;align-items:center;justify-content:center}
.h::before{content:"";position:absolute;inset:0;background:inherit;background-size:cover}
.bw::before{filter:grayscale(1) brightness(.72) contrast(1.05)}
.col::before{filter:brightness(.78) saturate(1.1)}
.h p{position:relative;z-index:1;color:#fff;font-family:P;font-weight:500;font-size:58px;line-height:1.4;text-align:center;padding:0 90px;text-wrap:balance;
  text-shadow:0 2px 4px rgba(0,0,0,.7),0 0 26px rgba(0,0,0,.55)}
.one{background-size:cover;background-position:50% 30%;position:relative;justify-content:flex-end;align-items:center;padding-bottom:110px}.one::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 45%,rgba(0,0,0,.55))}.one p{position:relative;color:#fff;font-family:P;font-weight:500;font-size:58px;line-height:1.45;text-align:center;padding:0 90px;text-wrap:balance;text-shadow:0 2px 4px rgba(0,0,0,.7),0 0 26px rgba(0,0,0,.55)}.one span{display:inline-block;margin-top:34px}</style></head><body><section class="slide"><div class="h bw" style="background-image:url(photos/03.jpg);background-position:50% 30%"><p>ساعة وحدة سيئة.</p></div><div class="h col" style="background-image:url(photos/03.jpg);background-position:50% 30%"><p>لسه عندك 23 ساعة.</p></div></section><section class="slide"><div class="h bw" style="background-image:url(photos/05.jpg);background-position:50% 62%"><p>يوم واحد سيء.</p></div><div class="h col" style="background-image:url(photos/05.jpg);background-position:50% 62%"><p>لسه عندك 364 يوم.</p></div></section><section class="slide"><div class="h bw" style="background-image:url(photos/25.jpg);background-position:50% 55%"><p>أسبوع واحد سيء.</p></div><div class="h col" style="background-image:url(photos/25.jpg);background-position:50% 55%"><p>لسه عندك 51 أسبوع.</p></div></section><section class="slide"><div class="h bw" style="background-image:url(photos/10.jpg);background-position:50% 48%"><p>شهر واحد سيء.</p></div><div class="h col" style="background-image:url(photos/10.jpg);background-position:50% 48%"><p>لسه عندك 11 شهر.</p></div></section><section class="slide one" style="background-image:url(photos/12.jpg)"><p>بطلي تتطلعي على اللي خسرتيه<br>وتطلعي على اللي عندك.<br><span>السعادة الحقيقية بتجي من طريقة نظرتك للأمور<br>ولسه عندك وقت.</span></p></section></body></html>
