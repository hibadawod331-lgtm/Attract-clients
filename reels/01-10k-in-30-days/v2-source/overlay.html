<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:R;font-weight:700;src:url(aref-ruqaa-arabic-700.woff2)}@font-face{font-family:R;font-weight:700;src:url(aref-ruqaa-latin-700.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:P;font-weight:400;src:url(ibm-plex-sans-arabic-arabic-400.woff2)}@font-face{font-family:P;font-weight:400;src:url(ibm-plex-sans-arabic-latin-400.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:P;font-weight:600;src:url(ibm-plex-sans-arabic-arabic-600.woff2)}@font-face{font-family:P;font-weight:600;src:url(ibm-plex-sans-arabic-latin-600.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-arabic-700.woff2)}@font-face{font-family:P;font-weight:700;src:url(ibm-plex-sans-arabic-latin-700.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#big{position:absolute;left:0;right:0;top:165px;text-align:center;font-family:R;font-weight:700;font-size:200px;line-height:1.05;
  background:linear-gradient(100deg,#F7D2C2 0%,#EEC0D8 45%,#C7B8F6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(235,190,225,.45));white-space:nowrap}
#big.small2{font-size:160px}
#small{position:absolute;left:0;right:0;top:178px;text-align:center;font-family:P;font-weight:400;font-size:54px;color:rgba(255,255,255,.92);
  text-shadow:0 2px 18px rgba(0,0,0,.55)}
#cap{position:absolute;left:40px;right:40px;top:1010px;text-align:center;font-family:P;font-weight:700;font-size:80px;color:#fff;
  text-shadow:0 3px 10px rgba(0,0,0,.6),0 0 26px rgba(0,0,0,.35)}
#pill{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;direction:rtl;
  padding:14px 30px;border-radius:60px;background:rgba(18,14,22,.55);border:1.5px solid rgba(255,255,255,.18);
  font-family:P;font-weight:600;font-size:30px;color:rgba(255,255,255,.9);letter-spacing:1px;white-space:nowrap}
#pill .ring{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#EEC0D8}
#pill .bar{width:170px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;direction:ltr}
#pill .bar i{display:block;height:100%;background:linear-gradient(90deg,#F7D2C2,#C7B8F6)}
#small{display:none!important}</style></head><body>
<div id="pill"><span class="ring"></span><span id="pl"></span><span class="bar"><i id="pb"></i></span><span id="pp"></span></div>
<div id="small"></div><div id="big"></div><div id="cap"></div>
<script>
let TL=null, MODE='front';
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function setup(tl,mode){TL=tl;MODE=mode;
  for(const id of ['pill','small','cap']) document.getElementById(id).style.display=mode==='front'?'':'none';
  document.getElementById('big').style.display=mode==='back'?'':'none';}
function render(t){
  const big=document.getElementById('big'), sm=document.getElementById('small'), cap=document.getElementById('cap');
  let k=TL.K.find(x=>t>=x[0]&&t<x[1]);
  if(k){const p=ease((t-k[0])/0.45), out=Math.min(1,(k[1]-t)/0.25);
    big.textContent=k[3]; big.className=k[3].length>8?'small2':'';
    big.style.opacity=Math.min(p,out); big.style.transform=`translateY(${(1-p)*40}px) scale(${1.12-0.12*p})`;
    big.style.filter=`blur(${(1-p)*14}px) drop-shadow(0 0 34px rgba(235,190,225,.45))`;
    const q=ease((t-k[0]-0.15)/0.4);
    sm.textContent=k[2]; sm.style.opacity=Math.min(q,out); sm.style.transform=`translateY(${(1-q)*24}px)`; sm.style.filter=`blur(${(1-q)*6}px)`;
  } else {big.style.opacity=0; sm.style.opacity=0;}
  let c=TL.caps.find(x=>t>=x[1]&&t<x[2]);
  if(c){const p=ease((t-c[1])/0.16); cap.textContent=c[0]; cap.style.opacity=p;
    cap.style.transform=`translateY(${(1-p)*22}px) scale(${0.92+0.08*p})`; cap.style.filter=`blur(${(1-p)*8}px)`;}
  else cap.style.opacity=0;
  let ps=TL.PILL.filter(x=>t>=x[0]).pop();
  document.getElementById('pl').textContent=ps[1];
  const prev=TL.PILL[Math.max(0,TL.PILL.indexOf(ps)-1)][2], fp=ease((t-ps[0])/0.6);
  const pct=Math.round(prev+(ps[2]-prev)*fp);
  document.getElementById('pb').style.width=pct+'%'; document.getElementById('pp').textContent=pct+'%';
  document.querySelector('#pill .ring').style.transform=`rotate(${t*360}deg)`;
  const pin=ease(t/0.5); document.getElementById('pill').style.opacity=pin;
  // state key for de-duplication
  return [k?Math.round(Math.min((t-k[0])/0.45,1)*30):-1, k?Math.round(Math.min((k[1]-t)/0.25,1)*10):-1, c?c[0]+Math.round(Math.min((t-c[1])/0.16,1)*20):'', ps[1], pct, MODE==='front'?Math.floor(t*12)%30:0].join('|');
}
</script></body></html>
