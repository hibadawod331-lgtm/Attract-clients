<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:700;src:url(ibm-plex-sans-arabic-700.woff2)}@font-face{font-family:M;font-weight:700;src:url(ibm-plex-sans-arabic-latin-700.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#cards{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:center;gap:34px}
.card{width:240px;height:300px;border-radius:22px;background-size:cover;background-position:center;box-shadow:0 18px 50px rgba(0,0,0,.55);border:4px solid rgba(255,255,255,.9)}
#title{direction:rtl;position:absolute;top:388px;left:60px;right:60px;text-align:center;font-family:M;font-weight:700;font-size:52px;line-height:1.35;color:#fff;
 text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.6)}
#cap{direction:rtl;position:absolute;top:1230px;left:40px;right:40px;text-align:center;font-family:M;font-weight:700;font-size:86px;color:#fff;
 text-shadow:0 3px 10px rgba(0,0,0,.7),0 0 26px rgba(0,0,0,.4)}
#cards.four{gap:16px}#cards.four .card{width:220px;height:275px;border-width:3px;border-radius:18px}
#hook{direction:rtl;text-wrap:balance;position:absolute;top:1120px;left:60px;right:60px;text-align:center;font-family:M;font-weight:700;font-size:84px;line-height:1.3;color:#fff;
 text-shadow:0 3px 12px rgba(0,0,0,.8),0 0 30px rgba(0,0,0,.5)}#hook b{color:#F2531E;font-weight:700}
</style></head><body>
<div id="cards"><div class="card" id="c0"></div><div class="card" id="c1"></div><div class="card" id="c2"></div><div class="card" id="c3"></div></div><div id="title"></div><div id="hook"><bdi dir="ltr">6</bdi> علامات إنك عندك <b>عقلية صاحبة بزنس</b>… بس انتي ما بتعرفي</div><div id="cap"></div>
<script>
let TL=null,MODE='front';const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function setup(tl,mode){TL=tl;MODE=mode;document.getElementById('cards').style.display=mode==='back'?'':'none';
 for(const id of ['title','cap','hook'])document.getElementById(id).style.display=mode==='front'?'':'none';}
function render(t){
 const s=TL.sec.find(x=>t>=x[0]&&t<x[1])||TL.sec[TL.sec.length-1];
 const p=ease((t-s[0])/0.5), o=Math.min(1,(s[1]-t)/0.25);
 const n=s[4]||2,st=n>2?0.75:0.15;document.getElementById('cards').className=n>2?'four':'';
 for(const i of [0,1,2,3]){const c=document.getElementById('c'+i);if(i>=n){c.style.display='none';continue}c.style.display='';
  const q=ease((t-s[0]-i*st)/0.5);const sg=(i%2?1:-1);
  c.style.backgroundImage=`url(img/${s[2]}_${i}.jpg)`;c.style.opacity=Math.min(q,o);
  c.style.transform=`translateY(${(1-q)*-50}px) rotate(${sg*4*(1-q)+sg*2}deg) scale(${0.85+0.15*q})`;}
 const isHook=s[2]==='hook';const hk=document.getElementById('hook');hk.style.visibility=isHook?'visible':'hidden';hk.style.opacity=isHook?Math.min(1,(s[1]-t)/0.25):0;
 const ti=document.getElementById('title');ti.style.visibility=isHook?'hidden':'visible';ti.innerHTML=s[3];const tq=ease((t-s[0]-0.25)/0.45);ti.style.opacity=Math.min(tq,o);ti.style.transform=`translateY(${(1-tq)*20}px)`;
 const c=isHook?null:TL.caps.find(x=>t>=x[1]&&t<x[2]);const cap=document.getElementById('cap');
 if(c){const q=ease((t-c[1])/0.14);cap.textContent=c[0];cap.style.opacity=q;cap.style.transform=`scale(${0.8+0.2*q})`;cap.style.filter=`blur(${(1-q)*6}px)`}else cap.style.opacity=0;
 return [s[2],Math.round(Math.min((t-s[0])/(0.8+((s[4]||2)-1)*0.75),1)*60),Math.round(o*8),MODE==='front'?(c?c[0]+c[1]+Math.round(Math.min((t-c[1])/0.14,1)*6):''):''].join('|');}
</script></body></html>
