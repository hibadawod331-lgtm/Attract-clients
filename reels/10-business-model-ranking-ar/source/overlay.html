<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:700;src:url(ibm-plex-sans-arabic-700.woff2)}@font-face{font-family:M;font-weight:700;src:url(ibm-plex-sans-arabic-latin-700.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:M;font-weight:500;src:url(ibm-plex-sans-arabic-500.woff2)}@font-face{font-family:M;font-weight:500;src:url(ibm-plex-sans-arabic-latin-500.woff2);unicode-range:U+0000-00FF}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:M}
#title{direction:rtl;position:absolute;top:170px;left:90px;right:90px;text-align:center;background:#fff;color:#111;font-weight:700;font-size:56px;line-height:1.3;padding:22px 30px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#title b{color:#F2531E}
#list{position:absolute;top:430px;right:36px}
.row{position:absolute;right:0;width:250px;height:100px}
.num{position:absolute;right:0;top:0;width:100px;height:100px;border-radius:50%;background:#F2531E;color:#fff;font-weight:700;font-size:54px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);border:4px solid rgba(255,255,255,.85)}
.slot{position:absolute;right:118px;top:6px;width:88px;height:88px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);background:rgba(0,0,0,.18)}
.slot svg{width:100%;height:100%;padding:16px}
#q{direction:rtl;position:absolute;top:1230px;left:60px;right:300px;text-align:center;color:#fff;font-weight:700;font-size:66px;text-shadow:0 3px 12px rgba(0,0,0,.75)}
#big{position:absolute;width:220px;height:220px}
#big svg{width:100%;height:100%;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6))}
#rank{position:absolute;top:1340px;left:110px;width:170px;height:170px;border-radius:50%;background:#F2531E;color:#fff;font-weight:700;font-size:110px;display:flex;align-items:center;justify-content:center;border:6px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#cap{direction:rtl;position:absolute;top:1640px;left:40px;right:40px;text-align:center;font-weight:700;font-size:74px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.75),0 0 26px rgba(0,0,0,.45)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="ugc" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="30" width="58" height="44" rx="8"/><path d="M72 44 L88 34 V70 L72 60"/><circle cx="43" cy="52" r="10"/></g>
<g id="aff" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M40 60 L60 40"/><path d="M33 47 L26 54 a14 14 0 0 0 20 20 L53 67"/><path d="M47 33 L54 26 a14 14 0 0 1 20 20 L67 53"/></g>
<g id="content" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="12" width="40" height="76" rx="8"/><path d="M44 40 L58 50 L44 60 Z" fill="#fff"/></g>
<g id="brand" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 22 a8 8 0 1 1 8 8 c-4 0 -8 3 -8 7 L50 40"/><path d="M50 40 L12 70 H88 Z"/></g>
<g id="free" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="24" width="60" height="40" rx="5"/><path d="M10 74 H90"/><path d="M42 40 L36 44 L42 48 M58 40 L64 44 L58 48"/></g>
<g id="coach" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="34" cy="34" r="11"/><path d="M14 78 c0 -16 9 -24 20 -24 s20 8 20 24"/><path d="M58 22 h28 v20 h-12 l-8 8 v-8 h-8 z"/></g>
<g id="digital" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 14 L84 30 V70 L50 86 L16 70 V30 Z"/><path d="M16 30 L50 46 L84 30 M50 46 V86"/></g>
</defs></svg>
<div id="title">ترتيب افضل بزنس مودل للبنات<br><b>من الاضعف للاقوى</b></div>
<div id="list"></div><div id="q"></div><div id="big"><svg viewBox="0 0 100 100"><use id="bigu" href="#ugc"/></svg></div><div id="rank"></div><div id="cap"></div>
<script>
let TL=null;const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const ROW=118,LT=430,RT=36,CX=540,CY=1430;
function setup(tl){TL=tl;const L=document.getElementById('list');
 for(let n=1;n<=7;n++){const r=document.createElement('div');r.className='row';r.style.top=((n-1)*ROW)+'px';
  r.innerHTML=`<div class="slot" id="s${n}"></div><div class="num">${n}</div>`;L.appendChild(r);}}
function slotXY(n){return [1080-RT-118-44, LT+(n-1)*ROW+6+44];}
function render(t){
 const ti=document.getElementById('title');ti.style.opacity=t<TL.title_end?Math.min(ease(t/0.35),(TL.title_end-t)/0.25):0;
 const L=document.getElementById('list');L.style.opacity=t<TL.title_end-0.4?0:Math.min(1,ease((t-TL.title_end+0.4)/0.4));
 let key=[Math.round(+ti.style.opacity*10),Math.round(+L.style.opacity*10)];
 for(const q of TL.Q){const s=document.getElementById('s'+q.rank);const placed=t>=q.ans+1.4;
  s.innerHTML=placed?`<svg viewBox="0 0 100 100"><use href="#${q.icon}"/></svg>`:'';s.style.borderStyle=placed?'solid':'dashed';s.style.background=placed?'rgba(242,83,30,.35)':'rgba(0,0,0,.18)';key.push(placed?1:0);}
 const q=TL.Q.find(x=>t>=x.t0&&t<x.t1);const Qd=document.getElementById('q'),B=document.getElementById('big'),R=document.getElementById('rank');
 if(q){const a=ease((t-q.t0)/0.3);Qd.textContent=q.q;Qd.style.opacity=t<q.ans+1.0?a:Math.max(0,1-(t-q.ans-1.0)/0.3);
  document.getElementById('bigu').setAttribute('href','#'+q.icon);
  const m=Math.min(1,Math.max(0,(t-q.ans-0.9)/0.5)),e=ease(m),[sx,sy]=slotXY(q.rank);
  const x=CX+(sx-CX)*e, y=CY+(sy-CY)*e, sc=(1-e)+e*(88/220);
  B.style.left=(x-110)+'px';B.style.top=(y-110)+'px';B.style.transform=`scale(${sc*(0.7+0.3*a)})`;B.style.opacity=m>=1?0:a;
  const rv=t>=q.ans?ease((t-q.ans)/0.2):0;R.textContent=q.rank;R.style.opacity=t<q.ans+1.1?rv:Math.max(0,1-(t-q.ans-1.1)/0.25);R.style.transform=`scale(${0.6+0.4*rv})`;
  key.push(q.rank,Math.round(a*8),Math.round(m*20),Math.round(rv*8),Math.round(+Qd.style.opacity*8),Math.round(+R.style.opacity*8));
 } else {Qd.style.opacity=0;B.style.opacity=0;R.style.opacity=0;}
 const c=TL.caps.find(x=>t>=x[1]&&t<x[2]);const cap=document.getElementById('cap');
 if(c){const k=ease((t-c[1])/0.14);cap.textContent=c[0];cap.style.opacity=k;cap.style.transform=`scale(${0.8+0.2*k})`;key.push(c[0]+c[1]+Math.round(Math.min((t-c[1])/0.14,1)*6))}else cap.style.opacity=0;
 return key.join('|');}
</script></body></html>
